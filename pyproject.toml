[build-system]
requires = ["setuptools>=64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
fallback_version = "0.0"

[project]
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
name = "nomad-distribution"
description = "nomad distribution template"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "nomad-lab[infrastructure]==2.0.0",
]

[project.urls]
repository = "https://github.com/FAIRmat-NFDI/nomad-distro-template"

[project.optional-dependencies]
# Add your plugins to the list below.
plugins = [
  'nomad-material-processing',
  'nomad-measurements',
  'nomad-baseclasses @ git+https://github.com/nomad-hzb/nomad-baseclasses.git',
  'nomad-chemical-energy @ git+https://github.com/nomad-hzb/nomad-chemical-energy.git',
  "nomad-north-jupyter>=0.2.6",
  "nomad-gui==2.0.0",
]
jupyter = [
'voila',
'ipyaggrid',
'ipysheet',
'ipydatagrid',
'jupyter-flex',
'ipyvuetify',
'ipympl',
'pyvis',
#'baybe',
'lmfit',
'jupyterlab_h5web',
'jupyterlab>4.0',
'xraylarch',
'seaborn', # 'jupyterhub<5','oauthenticator<16'
]

dev = ["nomad-lab[infrastructure, dev]==2.0.0"]

[tool.uv]
extra-index-url = [
  "https://gitlab.mpcdf.mpg.de/api/v4/projects/2187/packages/pypi/simple",
]
prerelease = "if-necessary-or-explicit"
#constraint-dependencies = ["hyperspy>=1.7.6", "pyzmq==27.0.2"]

[tool.setuptools.packages.find]
exclude = ["gui*", "docs*", "config*"]
